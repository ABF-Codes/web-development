<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/server">
        <label for="age">I am 18+</label>
        <input type="checkbox" id="age"  name="age" checked>
       
        <hr>
        <div>
            <input type="radio" id="apple" name="fruit" value="apple">
            <label for="apple">Apple</label>
            <br>
            <input type="radio" id="banana" name="fruit" value="Banana">
            <label for="banana">Banana</label>
            <br>
            <input type="radio" id="mango" name="fruit" value="Mango">
            <label for="mango">Mango</label>
        </div>
        <hr>
        <div>
             <label for="Maths">Maths</label>
        <input type="checkbox" id="Maths"  name="subjects" value="Maths">
        <label for="Urdu">Urdu</label>
        <input type="checkbox" id="Urdu"  name="subjects" value="Urdu">
        <label for="English">English</label>
        <input type="checkbox" id="English"  name="subjects" value="English">
        </div>
         <button type="submit">Submit</button>
    </form>
</body>
</html>
