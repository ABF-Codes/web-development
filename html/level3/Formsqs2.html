<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form action="/server">
        <h2>Registration Form</h2>
        <br>
        <input type="text" placeholder="First Name" name="firstnam" id="firstnam">
        <input type="text" placeholder="Second Name" name="secondnam" id="secondnam">
        <br>
        <label for="">Please Select Your Gender</label>
        <select name="gender" id="gender">
            <option>Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        <br>
          Do you agree to all Terms & Services?
            <label for="terms"></label>
            <input type="checkbox" id="terms"  name="terms">
            <button type="submit">Register </button>
    </div>
</body>
</html>
