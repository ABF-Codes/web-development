<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/action">
        <label for="Username">Enter your username:</label>
        <input type="text" placeholder="Enter Username" id="Username" name="user">
      


        <br>

        <label for="Password">Enter your Password</label>
        <input type="password" placeholder="Enter Password" id="Password" name="pass">
       
    
        <br>
        <label for="Number">Enter Number:</label>
        <input type="Number" placeholder="Enter Number" id="Number">

        <hr>

        <label for="Color">Enter Color</label>
        <input type="Color" placeholder="Enter Date and time" id="Color">
        <br>
        Date &nbsp; &amp; &nbsp;Time
        <input type="datetime-local">
<br>
        <button>Submit</button> <button type="reset">Reset</button>
        <br>
        <input type="submit" value="Click me">

    </form>
</body>
</html>
