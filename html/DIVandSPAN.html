<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span Element</title>
</head>
<body>
    <!-- div is block element -->
    <div style="background-color: aqua;">
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
    </div>

    <div  style="background-color:rosybrown;">
        <img src="WhatsApp Image 2026-07-28 at 3.25.54 PM.jpeg" width="50px" height="50px">
    </div>

    <br>
    <!-- span is inline element -->
         <span style="background-color: rgb(170, 151, 208);">
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
         </span>

</body>
</html>
